<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <h1>To-do list</h1>
    <form id="add-form">
      <label for="new-task" class="visually-hidden">New task</label>
      <input id="new-task" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <button type="button" id="clear-completed" hidden>Clear completed</button>
    <p id="count"></p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
