name: AI company
on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      idea:
        description: "Idea to build (opens an issue first)"
        required: false
      issue:
        description: "Or: an issue number to build"
        required: false
  schedule:
    - cron: "17 * * * *"   # resumes runs paused by the usage limit

jobs:
  team:
    uses: code-ravi007/ai-company-agents/.github/workflows/team.yml@main
    secrets: inherit
